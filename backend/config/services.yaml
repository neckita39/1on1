parameters:
    jwt_secret: '%env(JWT_SECRET)%'
    redis_host: '%env(REDIS_HOST)%'
    redis_port: '%env(int:REDIS_PORT)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\AuthService:
        arguments:
            $jwtSecret: '%jwt_secret%'

    App\Service\RateLimiter:
        arguments:
            $redisHost: '%redis_host%'
            $redisPort: '%redis_port%'
